stages:
    - build
    - analyze
    - deploy

build:project:
    stage: build
    image: alpine:3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    rules:
        - if: $CI_COMMIT_TAG
          when: on_success
        - if: $CI_COMMIT_BRANCH
          when: manual
    before_script:
        - apk add --no-cache zip
        - mv $ENV_FILE .env
        - echo "" >> .env
        - echo "VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" >> .env
    script:
        - mv compose.production.yml compose.yml
        - zip -r project.zip .env compose.yml
    artifacts:
        paths:
            - .env
            - .gitlab/ansible/
            - compose.yml
            - project.zip
        access: none
        expire_in: 1 hour

build:docker:
    stage: build
    image: docker:29.5@sha256:7278248384185bcbb54c7a76b2f0a7d354c4aac920605cc1ab48968d961052fb
    needs:
        - build:project
    services:
        - docker:29.5.0-dind-rootless@sha256:2379588ca8e9ed0d452464f4aed5361da6361791ec1a2111d44515c3985b2659
    variables:
        DOCKER_TLS_CERTDIR: "/certs"
    script:
        - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
        - docker compose build
        - docker compose push

analyze:sast:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/semgrep
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-sast-report.json
        reports:
            sast: gl-sast-report.json
        expire_in: 1 hour
    dependencies: []

analyze:iac:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/kics
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-sast-report.json
        reports:
            sast: gl-sast-report.json
        expire_in: 1 hour
    dependencies: []

analyze:secret-detection:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/secrets
    script:
        - /analyzer run
    artifacts:
        access: developer
        paths:
            - gl-secret-detection-report.json
        reports:
            secret_detection: gl-secret-detection-report.json
        expire_in: 1 hour
    dependencies: []

analyze:docker-container:
    stage: analyze
    image: $CI_TEMPLATE_REGISTRY_HOST/security-products/container-scanning
    script:
        - export CI_APPLICATION_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
        - gtcs scan
    variables:
        CS_DOCKERFILE_PATH: docker/Dockerfile
        CI_APPLICATION_REPOSITORY: $CI_REGISTRY_IMAGE
    artifacts:
        access: developer
        paths:
            - gl-container-scanning-report.json
        reports:
            container_scanning: gl-container-scanning-report.json
        expire_in: 1 hour
    dependencies: []

deploy:ansible:
    stage: deploy
    image: alpine:3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    variables:
        GIT_STRATEGY: none
    before_script:
        - apk add --no-cache openssl openssh-client ansible
        - eval $(ssh-agent -s)
        - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - ssh-keyscan -H 10.0.0.22 >> ~/.ssh/known_hosts
        - echo $ANSIBLE_VAULT_PASSWORD > .vault_password.txt
    script:
        - ansible-playbook -i .gitlab/ansible/hosts.yml --vault-password-file .vault_password.txt .gitlab/ansible/deploy.yml
